# Frappe / ERPNext multi-site bench for Coolify (Docker Compose build pack).
# Based on https://github.com/frappe/frappe_docker (compose.yaml + pwd.yml).
#
# Coolify notes:
# - Do not put shell scripts or values starting with "$" (like $$host) in this
#   file: Coolify parses them as environment variable names and fails with
#   "The key must start with a letter or underscore...". Scripts live in ./scripts.
# - Only the "frontend" service gets domains (port 8080), one per site.

services:
  configurator:
    build:
      context: .
      dockerfile: Dockerfile
    image: frappe-${BENCH_NAME:-main}:v16
    command: ["configure.sh"]
    restart: "no"
    exclude_from_hc: true
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  create-sites:
    image: frappe-${BENCH_NAME:-main}:v16
    pull_policy: never
    command: ["create-sites.sh"]
    restart: "no"
    exclude_from_hc: true
    environment:
      SITES: ${SITES:?}
      INSTALL_APPS: ${INSTALL_APPS:-}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
      DB_ROOT_PASSWORD: ${SERVICE_PASSWORD_DB}
      SITE_PROTOCOL: ${SITE_PROTOCOL:-https}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  backend:
    image: frappe-${BENCH_NAME:-main}:v16
    pull_policy: never
    restart: unless-stopped
    environment:
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  frontend:
    image: frappe-${BENCH_NAME:-main}:v16
    pull_policy: never
    restart: unless-stopped
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      NGINX_LISTEN_PORT: "8080"
      TRUST_UPSTREAM_FORWARDED_PROTO: "on"
      UPSTREAM_REAL_IP_ADDRESS: 0.0.0.0/0
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "on"
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      - backend
      - websocket

  websocket:
    image: frappe-${BENCH_NAME:-main}:v16
    pull_policy: never
    restart: unless-stopped
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    image: frappe-${BENCH_NAME:-main}:v16
    pull_policy: never
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "short,default"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-long:
    image: frappe-${BENCH_NAME:-main}:v16
    pull_policy: never
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "long,default,short"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  scheduler:
    image: frappe-${BENCH_NAME:-main}:v16
    pull_policy: never
    restart: unless-stopped
    command: ["bench", "schedule"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
    environment:
      MARIADB_ROOT_PASSWORD: ${SERVICE_PASSWORD_DB}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:
